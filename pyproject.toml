[build-system]
requires = ["setuptools>=80.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorpow"
version = "0.1.0"
description = "TensorPoW: the fastest permissionless PoW blockchain."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Arav Jain" }]
dependencies = [
    "blake3>=1.0.8,<2.0.0",
    "cryptography>=46.0.0,<47.0.0",
    "cython>=3.2.0,<4.0.0",
    "libp2p>=0.6.0,<0.7.0",
    "numpy>=2.0.0,<3.0.0",
    "protobuf>=5.29.0,<7.0.0",
    "reedsolo>=1.7.0,<2.0.0",
    "rocksdict>=0.3.29,<0.4.0",
    "torch>=2.12.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "daytona>=0.183.0,<0.184.0",
    "mypy>=2.1.0,<3.0.0",
    "pre-commit>=4.6.0,<5.0.0",
    "pytest>=9.0.3,<10.0.0",
    "ruff>=0.15.14,<0.16.0",
]
storage = [
    "rocksdict>=0.3.29,<0.4.0",
]

[project.scripts]
tensorpow-mine = "tensorpow.cli.mine:main"
tensorpow-node = "tensorpow.cli.node:main"
tensorpow-wallet = "tensorpow.cli.wallet:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "determinism: bit-exact consensus determinism checks",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts"]
strict = true
warn_unreachable = true
warn_unused_configs = true
pretty = true
