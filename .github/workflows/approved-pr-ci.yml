name: Approved PR CI

# Runs full PR CI for PRs that trusted-pr-ci.yml does not cover (forks, bots, authors
# without write access) once a write-access reviewer approves the exact head SHA.
# workflow_run always runs this file and the scripts it checks out from the default
# branch, so fork code can't alter the gate. Trusted PRs are skipped here (see
# scripts/validate_pr_approval.py) because they already run CI on every push.

on:
  workflow_run:
    workflows: ["PR Review Approved"]
    types: [completed]

permissions: {}

jobs:
  prepare:
    name: Validate PR approval
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.validate.outputs.should_run }}
      pr_number: ${{ steps.validate.outputs.pr_number }}
      head_sha: ${{ steps.validate.outputs.head_sha }}
      head_repo: ${{ steps.validate.outputs.head_repo }}
      head_ref: ${{ steps.validate.outputs.head_ref }}
    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download approval artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          run-id: ${{ github.event.workflow_run.id }}
          path: approval-artifacts
          github-token: ${{ github.token }}
      - name: Validate approval
        id: validate
        env:
          APPROVAL_ARTIFACT_DIR: approval-artifacts
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/validate_pr_approval.py

  ci:
    name: PR CI
    needs: prepare
    if: ${{ needs.prepare.outputs.should_run == 'true' }}
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/pr-ci-jobs.yml
    with:
      pr_number: ${{ fromJSON(needs.prepare.outputs.pr_number) }}
      head_repo: ${{ needs.prepare.outputs.head_repo }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
    secrets:
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
