name: Determinism

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      run_cuda:
        description: "Run the Daytona H100 CUDA determinism job"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  linux-x86-cpu:
    name: Linux x86 CPU
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run determinism tests
        env:
          TENSORPOW_DETERMINISM_BACKEND: cpu
        run: pytest -m determinism tests/determinism

  linux-arm-cpu:
    name: Linux ARM CPU
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run determinism tests
        env:
          TENSORPOW_DETERMINISM_BACKEND: cpu
        run: pytest -m determinism tests/determinism

  macos-arm-mps:
    name: macOS ARM MPS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install system packages
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libgmp-dev
          fi
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run determinism tests
        env:
          TENSORPOW_DETERMINISM_BACKEND: mps
        run: pytest -m determinism tests/determinism

  linux-x86-cuda:
    name: Linux x86 CUDA (Daytona H100)
    if: ${{ (github.event_name == 'push' && vars.DAYTONA_GPU_SNAPSHOT_READY == 'true') || (github.event_name == 'workflow_dispatch' && inputs.run_cuda) }}
    concurrency:
      group: tensorpow-cuda-determinism
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
      DAYTONA_TARGET: ${{ vars.DAYTONA_TARGET || 'us-east-1' }}
      DAYTONA_GPU_SNAPSHOT: ${{ vars.DAYTONA_GPU_SNAPSHOT || 'daytona-gpu' }}
      DAYTONA_GPU_EXPECTED_DEVICE_TOKENS: ${{ vars.DAYTONA_GPU_EXPECTED_DEVICE_TOKENS || 'h100' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Daytona runner dependencies
        run: python -m pip install "daytona>=0.183.0,<0.184.0"
      - name: Run CUDA determinism in Daytona
        run: python scripts/run_daytona_cuda_ci.py
