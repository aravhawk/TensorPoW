name: Determinism

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      run_cuda:
        description: "Run the Daytona H100 CUDA determinism job"
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  linux-x86-cpu:
    name: Linux x86 CPU
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install locked environment
        # Install exactly what uv.lock pins (and pip-audit checks), with hashes.
        run: |
          uv sync --locked --all-extras --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Run determinism tests
        env:
          TENSORPOW_DETERMINISM_BACKEND: cpu
        run: pytest -m determinism tests/determinism

  linux-arm-cpu:
    name: Linux ARM CPU
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install locked environment
        # Install exactly what uv.lock pins (and pip-audit checks), with hashes.
        run: |
          uv sync --locked --all-extras --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Run determinism tests
        env:
          TENSORPOW_DETERMINISM_BACKEND: cpu
        run: pytest -m determinism tests/determinism

  macos-arm-mps:
    name: macOS ARM MPS
    permissions:
      contents: read
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install system packages
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libgmp-dev
          fi
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install locked environment
        # Install exactly what uv.lock pins (and pip-audit checks), with hashes.
        # The lock pins torch 2.13 (< 2.15, which regressed MPS int32 matmul on
        # GitHub's paravirtual macOS runners); keep it below 2.15 when re-locking.
        run: |
          uv sync --locked --all-extras --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Run determinism tests
        env:
          TENSORPOW_DETERMINISM_BACKEND: mps
        run: pytest -m determinism tests/determinism

  linux-x86-cuda:
    name: Linux x86 CUDA (Daytona H100)
    permissions:
      contents: read
    if: ${{ (github.event_name == 'push' && vars.DAYTONA_GPU_SNAPSHOT_READY == 'true') || (github.event_name == 'workflow_dispatch' && inputs.run_cuda) }}
    # Never cancel a running GPU job; a newer pending run replaces an older one.
    concurrency:
      group: tensorpow-daytona-gpu-determinism
      cancel-in-progress: false
    # Bounds GPU spend: up to ~35 min of GPU queueing plus setup and tests.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    env:
      DAYTONA_GPU_SNAPSHOT: ${{ vars.DAYTONA_GPU_SNAPSHOT || 'daytona-gpu' }}
      DAYTONA_GPU_EXPECTED_DEVICE_TOKENS: ${{ vars.DAYTONA_GPU_EXPECTED_DEVICE_TOKENS || 'h100' }}
      DAYTONA_GPU_QUEUE_TIMEOUT_MINUTES: ${{ vars.DAYTONA_GPU_QUEUE_TIMEOUT_MINUTES }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # No dependency cache next to DAYTONA_API_KEY: approved PR code runs in
          # the default branch's cache scope and could plant a poisoned entry.
          python-version: "3.12"
      - name: Install Daytona runner dependencies
        run: python -m pip install --require-hashes --no-deps -r .github/requirements/daytona-runner.txt
      - name: Run CUDA determinism in Daytona
        id: cuda
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        # exec so Python is the step's entry process and receives the cancel SIGINT.
        run: exec python scripts/run_daytona_cuda_ci.py
      - name: Clean up Daytona sandboxes
        if: ${{ always() && steps.cuda.outcome != 'skipped' }}
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: python scripts/run_daytona_cuda_ci.py --cleanup
