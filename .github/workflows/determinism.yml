name: Determinism

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      run_cuda:
        description: "Run the self-hosted CUDA determinism job"
        required: false
        default: false
        type: boolean

jobs:
  linux-x86-cpu:
    name: Linux x86 CPU
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run determinism tests
        env:
          TENSORPOW_DETERMINISM_BACKEND: cpu
        run: pytest -m determinism tests/determinism

  linux-arm-cpu:
    name: Linux ARM CPU
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run determinism tests
        env:
          TENSORPOW_DETERMINISM_BACKEND: cpu
        run: pytest -m determinism tests/determinism

  macos-arm-mps:
    name: macOS ARM MPS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install system packages
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libgmp-dev
          fi
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run determinism tests
        env:
          TENSORPOW_DETERMINISM_BACKEND: mps
        run: pytest -m determinism tests/determinism

  linux-x86-cuda:
    name: Linux x86 CUDA
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_cuda }}
    runs-on: [self-hosted, linux, x64, cuda, tensorpow-cuda]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install system packages
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libgmp-dev
          fi
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Show CUDA device
        run: python -c "import torch; assert torch.cuda.is_available(); print(torch.cuda.get_device_name(0))"
      - name: Run determinism tests
        env:
          TENSORPOW_DETERMINISM_BACKEND: cuda
        run: pytest -m determinism tests/determinism
