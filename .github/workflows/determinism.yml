name: Determinism

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      run_cuda:
        description: "Run the Daytona H100 CUDA determinism job"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  linux-x86-cpu:
    name: Linux x86 CPU
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run determinism tests
        env:
          TENSORPOW_DETERMINISM_BACKEND: cpu
        run: pytest -m determinism tests/determinism

  linux-arm-cpu:
    name: Linux ARM CPU
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run determinism tests
        env:
          TENSORPOW_DETERMINISM_BACKEND: cpu
        run: pytest -m determinism tests/determinism

  macos-arm-mps:
    name: macOS ARM MPS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install system packages
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libgmp-dev
          fi
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run determinism tests
        env:
          TENSORPOW_DETERMINISM_BACKEND: mps
        run: pytest -m determinism tests/determinism

  linux-x86-cuda:
    name: Linux x86 CUDA (Daytona H100)
    if: ${{ (github.event_name == 'push' && vars.DAYTONA_GPU_SNAPSHOT_READY == 'true') || (github.event_name == 'workflow_dispatch' && inputs.run_cuda) }}
    # Never cancel a running GPU job; a newer pending run replaces an older one.
    concurrency:
      group: tensorpow-daytona-gpu-determinism
      cancel-in-progress: false
    # Bounds GPU spend: up to ~35 min of GPU queueing plus setup and tests.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    env:
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
      DAYTONA_GPU_SNAPSHOT: ${{ vars.DAYTONA_GPU_SNAPSHOT || 'daytona-gpu' }}
      DAYTONA_GPU_EXPECTED_DEVICE_TOKENS: ${{ vars.DAYTONA_GPU_EXPECTED_DEVICE_TOKENS || 'h100' }}
      DAYTONA_GPU_QUEUE_TIMEOUT_MINUTES: ${{ vars.DAYTONA_GPU_QUEUE_TIMEOUT_MINUTES }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # No dependency cache next to DAYTONA_API_KEY: approved PR code runs in
          # the default branch's cache scope and could plant a poisoned entry.
          python-version: "3.12"
      - name: Install Daytona runner dependencies
        run: python -m pip install "daytona>=0.226.0,<0.227.0"
      - name: Run CUDA determinism in Daytona
        id: cuda
        # exec so Python is the step's entry process and receives the cancel SIGINT.
        run: exec python scripts/run_daytona_cuda_ci.py
      - name: Clean up Daytona sandboxes
        if: ${{ always() && steps.cuda.outcome != 'skipped' }}
        run: python scripts/run_daytona_cuda_ci.py --cleanup
