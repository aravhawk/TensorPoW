name: Daytona GPU Profile Check

on:
  workflow_dispatch:

permissions: {}

jobs:
  setup:
    name: Verify Daytona GPU profile
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # No dependency cache next to DAYTONA_API_KEY: approved PR code runs in
          # the default branch's cache scope and could plant a poisoned entry.
          python-version: "3.12"
      - name: Install Daytona setup dependencies
        run: python -m pip install --require-hashes --no-deps -r .github/requirements/daytona-runner.txt
      - name: Verify Daytona GPU snapshot
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: python scripts/create_daytona_gpu_snapshot.py --no-create
