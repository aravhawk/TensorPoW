name: Daytona GPU Profile Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    name: Verify Daytona GPU profile
    runs-on: ubuntu-latest
    env:
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
      DAYTONA_TARGET: ${{ vars.DAYTONA_TARGET || 'us-east-1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Daytona setup dependencies
        run: python -m pip install "daytona>=0.183.0,<0.184.0"
      - name: Verify Daytona GPU snapshot
        run: python scripts/create_daytona_gpu_snapshot.py --no-create
