name: Daytona GPU Profile Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    name: Verify Daytona GPU profile
    runs-on: ubuntu-latest
    env:
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Daytona setup dependencies
        run: python -m pip install "daytona>=0.226.0,<0.227.0"
      - name: Verify Daytona GPU snapshot
        run: python scripts/create_daytona_gpu_snapshot.py --no-create
