name: Daytona Snapshot Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    name: Create Daytona GPU snapshot
    runs-on: ubuntu-latest
    env:
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Daytona setup dependencies
        run: python -m pip install -e ".[dev]"
      - name: Create or verify Daytona GPU snapshot
        run: python scripts/create_daytona_gpu_snapshot.py --activate
