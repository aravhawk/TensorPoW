name: PR Review Approved

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  record:
    name: Record approved PR SHA
    if: ${{ github.event.review.state == 'approved' }}
    runs-on: ubuntu-latest
    steps:
      - name: Write approval metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWER: ${{ github.event.review.user.login }}
          REVIEW_STATE: ${{ github.event.review.state }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          mkdir -p approval
          jq -n \
            --argjson pr_number "$PR_NUMBER" \
            --arg reviewer "$REVIEWER" \
            --arg state "$REVIEW_STATE" \
            --arg head_sha "$HEAD_SHA" \
            --arg head_repo "$HEAD_REPO" \
            --arg head_ref "$HEAD_REF" \
            '{
              pr_number: $pr_number,
              reviewer: $reviewer,
              state: $state,
              head_sha: $head_sha,
              head_repo: $head_repo,
              head_ref: $head_ref
            }' > approval/approval.json
      - name: Upload approval metadata
        uses: actions/upload-artifact@v4
        with:
          name: approved-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: approval/approval.json
          if-no-files-found: error
